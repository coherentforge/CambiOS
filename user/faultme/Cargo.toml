[package]
name = "cambios-faultme"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "CambiOS faultme — on-demand fixture that takes a deliberate user page fault so the ADR-019 fault-reap path stays testable (`faultme` at the shell; a second run proves the first leaked nothing)."

[dependencies]
cambios-libsys = { path = "../libsys" }
cambios-libsys-rt = { path = "../libsys-rt" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"
