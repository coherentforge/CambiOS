[package]
name = "cambios-blk-proto"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "The block-driver IPC seam of CambiOS: endpoints, command and status bytes, and the fixed request/reply encodings shared by every block driver (virtio-blk, nvme, ahci) and the kernel's BlockDriverClient. Pure wire format; no transport, no device knowledge."

[lib]
path = "src/lib.rs"

# No dependencies beyond `core`. The kernel and every user-space block
# driver depend on this crate; it depends on nothing.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"
