timeout: 1
serial: yes

/CambiOS Microkernel
    protocol: limine
    kernel_path: boot():/boot/cambios_microkernel
    # ADR-018 (step 9 shape): module ORDER here is NOT load-bearing.
    # The kernel starts nothing itself — it verifies + transcribes
    # manifest.bin, registers every other module by name, and creates
    # init.elf as PID 1. Init spawns the boot wave in manifest.toml's
    # depends_on order, gating each spawn on the service's readiness
    # ping. Both manifest.bin and init.elf are REQUIRED: either missing
    # is a typed boot failure ([BOOT FAIL]), never a fallback.
    #
    # On-demand apps (tree, worm, ping, sprouty, hello-window) are
    # listed so their bytes are loaded, but init never spawns them —
    # `play <name>` (shell / terminal-window) does, and the kernel
    # binds each one's own manifest AID + grants at that spawn.
    #
    # scanout-virtio-gpu is the default scanout driver (registers
    # endpoint 27, virtio-gpu resource per display, shared channel
    # with the compositor; FrameReady → memcpy + TRANSFER_TO_HOST_2D +
    # RESOURCE_FLUSH). scanout-limine (the linear-framebuffer fallback
    # for hosts without virtio-gpu) is declared in manifest.toml under
    # the `framebuffer-fallback` profile and not staged here — the
    # default make run / run-gui targets always attach virtio-gpu-pci.
    # Not staged: i219-net, hello.
    module_path: boot():/boot/manifest.bin
    module_path: boot():/boot/init.elf
    module_path: boot():/boot/policy-service.elf
    module_path: boot():/boot/key-store-service.elf
    module_path: boot():/boot/fs-service.elf
    module_path: boot():/boot/virtio-blk.elf
    # fde-mount (ADR-032 § Architecture) — walks the FDE unlock flow:
    # probes PIV health, verifies dev PIN, calls SYS_READ_VOLUME_HEADER
    # + SYS_VERIFY_VOLUME_HEADER, walks the slot table for a live
    # YubiKey slot, calls piv_decrypt for the X25519 shared secret,
    # derives the AES-256 master key via Blake3 + ChaCha20-Poly1305,
    # installs it via SYS_INSTALL_MASTER_KEY. Exits cleanly in default
    # builds (no PIV backend → NoPiv outcome → exit without installing).
    module_path: boot():/boot/fde-mount.elf
    module_path: boot():/boot/virtio-net.elf
    module_path: boot():/boot/udp-stack.elf
    module_path: boot():/boot/scanout-virtio-gpu.elf
    module_path: boot():/boot/compositor.elf
    module_path: boot():/boot/virtio-input.elf
    # usb-host — userspace xHCI controller driver. Owns the xHCI
    # transport (enumeration, addressing, control + bulk transfers)
    # and exposes BULK_OUT / BULK_IN over endpoint 31. Idles cleanly
    # when no xHCI controller is present (e.g. aarch64/riscv64 boot
    # without -device qemu-xhci).
    module_path: boot():/boot/usb-host.elf
    # ccid — CCID 1.1 class driver. Frames PC_to_RDR_* / RDR_to_PC_*
    # messages over usb-host's bulk transport. At boot issues a
    # GetSlotStatus to verify the path through the configured CCID
    # endpoints; future PIV APDU commands will arrive on its endpoint
    # 33 from key-store-service.
    module_path: boot():/boot/ccid.elf
    module_path: boot():/boot/terminal-window.elf
    module_path: boot():/boot/ping.elf
    module_path: boot():/boot/sprouty.elf
    module_path: boot():/boot/tree.elf
    module_path: boot():/boot/worm.elf
    module_path: boot():/boot/hello-window.elf
    module_path: boot():/boot/faultme.elf
    # audit-tail (ADR-023) — kernel audit ring consumer. Holds
    # CapabilityKind::AuditConsumer (manifest.toml `audit-consumer`),
    # calls SYS_AUDIT_ATTACH for an RO mapping of the audit ring,
    # resolves subject_pid → did:key via SYS_GET_PROCESS_PRINCIPAL.
    module_path: boot():/boot/audit-tail.elf
    module_path: boot():/boot/shell.elf
