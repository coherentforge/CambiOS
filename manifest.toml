#
# CambiOS boot-service registry — the endpoint-registry source artifact
# (ADR-037 Phase 2) and the single source tools/build-manifest generates
# the signed ADR-018 boot manifest from. This file is the build-time
# authority on (service -> reserved endpoints, capabilities, lifecycle,
# dependencies); the kernel's reservation + spawn-grant tables are its
# runtime transcription. Never a parallel authority: change endpoints
# HERE, and client const tables (libsys / libfs-proto / libgui-proto /
# libscanout) must agree until they are generated from this file.
#
# Endpoint map (kernel MAX_ENDPOINTS = 64; 0 = REPLY_ENDPOINT sentinel,
# unusable; 1 = init):
#   14/15 terminal-window back/front   24/25/26 virtio-blk client/
#   16 fs-service                               kernel-reply/kernel-cmd
#   17 key-store-service               27 scanout driver
#   18 shell                           28 compositor
#   20 virtio-net                      30 compositor input
#   21 udp-stack                       31 usb-host
#   22/23 policy query/response        32 fde-mount
#                                      33 ccid
#   19 ping                            61 tree   62 worm   63 sprouty
#   29 hello-window
# Apps (games, hello-window) are manifest entries with
# `lifetime = "on-demand"` (ADR-018 step 9): init does NOT spawn them;
# any CreateProcess holder (shell, terminal-window) spawns them by
# name, and the kernel binds the entry's derived AID + exactly its
# grants — "tree runs as tree". Their endpoints are reserved like any
# service's. On-demand entries can neither declare nor be named in
# depends_on (build-manifest and init's engine both reject that).
#
# Grant posture per entry (assembled by build-manifest, ADR-018 § 2):
# receive on each reserved endpoint + send on all endpoints (replies
# target clients' self-chosen reply endpoints) + the System caps named
# here. `system` entries mirror the code-verified channel_create /
# spawn / map-framebuffer call sites (create-channel = compositor +
# scanout drivers; create-process = shell + terminal-window;
# map-framebuffer = scanout-limine). Since step 9 this file is the
# ONLY grant authority — the kernel has no name-based grants left.
#
# depends_on = hard startup dependencies only (init spawns in DAG
# order and gates on readiness pings). Soft orderings the retired
# boot chain encoded (e.g. "policy first so enforcement is warm") are
# NOT dependencies; the kernel's fail-open policy window covers them.
#
# `arch` tags select per-deployment manifests (`--arch`); `profile`
# tags select between entries that fill the same role (`--profile`,
# default "default"). A dependant names a ROLE by the endpoint it
# talks to — `depends_on_endpoints = [27]` — and build-manifest
# resolves that to whichever kept entry owns the endpoint, so the
# emitted manifest is always a plain name dependency on the one
# driver this image carries.

[init]
endpoint = 1

# --- storage + identity chain ------------------------------------------------

[[service]]
name = "policy-service"
endpoints = [22, 23]

[[service]]
name = "key-store-service"
endpoints = [17]

[[service]]
name = "fs-service"
endpoints = [16]
depends_on = ["key-store-service"]

[[service]]
name = "virtio-blk"
endpoints = [24, 25, 26]

[[service]]
name = "fde-mount"
endpoints = [32]
# unlock-volume gates SYS_READ_VOLUME_HEADER + SYS_INSTALL_MASTER_KEY
# (replaces the bootstrap-equality check those handlers used pre-cutover).
system = ["unlock-volume"]
lifetime = "one-shot"
depends_on = ["virtio-blk", "key-store-service"]

# --- network -------------------------------------------------------------------

[[service]]
name = "virtio-net"
endpoints = [20]

[[service]]
name = "udp-stack"
endpoints = [21]
system = ["set-wallclock"]
depends_on = ["virtio-net"]

# --- GUI stack -----------------------------------------------------------------

# Endpoint 27 is the scanout-driver ROLE: exactly one driver owns it
# per profile. scanout-virtio-gpu fills it in the default profile;
# scanout-limine (below) under `framebuffer-fallback`.
[[service]]
name = "scanout-virtio-gpu"
endpoints = [27]
system = ["create-channel"]
# GUI stack ships on x86_64 + aarch64 only — riscv64 has no scanout
# path yet (ADR-014 4.c+). The riscv64 manifest omits these four so
# init never reports phantom spawn failures for services that are
# not staged there.
arch = ["x86_64", "aarch64"]
profile = ["default"]

[[service]]
name = "compositor"
endpoints = [28, 30]
system = ["create-channel", "emit-input-audit"]
# Depends on whoever serves endpoint 27 (RegisterCompositor goes
# there), not on a driver by name — see the header comment.
depends_on_endpoints = [27]
arch = ["x86_64", "aarch64"]

[[service]]
name = "virtio-input"
depends_on = ["compositor"]
arch = ["x86_64", "aarch64"]

[[service]]
name = "terminal-window"
endpoints = [14, 15]
system = ["create-process", "set-wallclock"]
depends_on = ["compositor"]
arch = ["x86_64", "aarch64"]

# scanout-limine — the FALLBACK scanout driver: same compositor↔driver
# protocol as scanout-virtio-gpu, writing into the bootloader's linear
# framebuffer. The driver that matters on real hardware without
# virtio-gpu (UEFI GOP). Fills the endpoint-27 role under the
# `framebuffer-fallback` profile (`build-manifest --profile
# framebuffer-fallback`); no image target stages it yet.
# Revisit when: the first bare-metal GOP boot needs an image (add a
# `manifest-gop` / image target that stages scanout-limine.elf).
[[service]]
name = "scanout-limine"
endpoints = [27]
system = ["create-channel", "map-framebuffer"]
profile = ["framebuffer-fallback"]
arch = ["x86_64", "aarch64"]

# --- on-demand apps (spawned by `play` / the terminal, never by init) ---------

[[service]]
name = "tree"
endpoints = [61]
lifetime = "on-demand"
arch = ["x86_64", "aarch64"]

[[service]]
name = "worm"
endpoints = [62]
lifetime = "on-demand"
arch = ["x86_64", "aarch64"]

[[service]]
name = "sprouty"
endpoints = [63]
lifetime = "on-demand"
arch = ["x86_64", "aarch64"]

[[service]]
name = "ping"
endpoints = [19]
lifetime = "on-demand"
arch = ["x86_64", "aarch64"]

# hello-window — the canonical libgui client / regression canary.
[[service]]
name = "hello-window"
endpoints = [29]
lifetime = "on-demand"
arch = ["x86_64", "aarch64"]

# --- USB / PIV chain -------------------------------------------------------------

[[service]]
name = "usb-host"
endpoints = [31]

[[service]]
name = "ccid"
endpoints = [33]
depends_on = ["usb-host"]

# --- observability + shell -------------------------------------------------------

[[service]]
name = "audit-tail"
system = ["audit-consumer"]

[[service]]
name = "shell"
endpoints = [18]
system = ["create-process"]
depends_on = ["fs-service"]
